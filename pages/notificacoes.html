<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Clicks — Notificações</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<style>
.nt { align-items: flex-start; }
.nt.novo { border-color: var(--accent); }
.nt .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.nt.novo .ico { background: var(--accent-soft); color: var(--accent); }
</style></head><body data-page="notificacoes">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main data-photos>
<div class="cluster" style="justify-content:space-between;align-items:flex-end">
  <div><h1 style="margin:0">Notificações</h1><p style="margin:8px 0 0">Tudo o que acontece com você na comunidade. Cada aviso também chega por e-mail, conforme as suas <a href="configuracoes.html#notificacoes">preferências</a>.</p></div>
  <button class="btn btn-secondary btn-sm" type="button" id="todas">Marcar todas como lidas</button>
</div>
<div class="chips" id="filtro" style="margin:24px 0 12px">
  <button class="chip" type="button" aria-pressed="true" data-f="">Todas</button><button class="chip" type="button" aria-pressed="false" data-f="comentario">Comentários</button><button class="chip" type="button" aria-pressed="false" data-f="mencao">Menções e marcações</button><button class="chip" type="button" aria-pressed="false" data-f="seguidor">Seguidores</button><button class="chip" type="button" aria-pressed="false" data-f="contato">Contatos</button><button class="chip" type="button" aria-pressed="false" data-f="desafio">Desafios</button><button class="chip" type="button" aria-pressed="false" data-f="compra">Ingressos e compras</button>
</div>
<div class="list" id="lista"></div>
</main><footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer><script>
document.addEventListener("DOMContentLoaded", function () {
  var C = window.C365;
  function ler(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } }
  /* [id, tipo, ícone, texto, quando, destino (href ou foto:<id>)] */
  var N = [
    ["n1", "desafio", "target", "<b>Desafio do dia</b> liberado. Você tem até 23:59:59 para publicar.", "Hoje, 00:00", "desafio-do-dia.html"],
    ["n2", "comentario", "chat", "<b>Júlia Santos</b> comentou em “Primeiro click do mês”: “Que luz bonita nessa esquina!”", "Hoje, 08:14", "foto:marcosandrade-1"],
    ["n3", "mencao", "user", "<b>Ana Lima</b> marcou você na foto “Antes do trânsito”.", "Hoje, 07:02", "foto:analima-1"],
    ["n4", "contato", "mail", "<b>Carla Nunes</b> quer licenciar “Primeiro click do mês” para uso comercial.", "Ontem, 18:40", "mensagens.html#interessados"],
    ["n5", "seguidor", "user", "<b>Marina Faria</b> começou a seguir você.", "Ontem, 11:20", "perfil.html#@marinafaria"],
    ["n6", "comentario", "chat", "Um comentário de <b>Thiago Rocha</b> aguarda a sua aprovação.", "Ontem, 09:03", "foto:marcosandrade-2"],
    ["n7", "mencao", "at", "<b>Wesley Oliveira</b> citou você: “@marcosandrade você precisa ver esse reflexo”.", "Seg", "foto:analima-2"],
    ["n8", "desafio", "star", "Você completou <b>7 dias seguidos</b> e ganhou a conquista Semana completa.", "Dom", "conquistas.html"],
    ["n9", "compra", "ticket", "Seu ingresso para <b>Foto na Paulista</b> está confirmado.", "Sáb", "meus-ingressos.html"],
    ["n10", "desafio", "calendar", "A <b>semana de desafios</b> que começa no domingo já está disponível.", "Sáb", "desafios.html"],
    ["n11", "compra", "mail", "Saiu o <b>Radar 365</b> desta semana.", "Sex", "radar.html"]
  ];
  var lidas = ler("c365-notif-lidas", ["n8", "n9", "n10", "n11"]), filtro = "";
  function salvar() { try { localStorage.setItem("c365-notif-lidas", JSON.stringify(lidas)); } catch (e) {} }
  function ico(n) { return C && C.icon ? C.icon(n, "i-sm") : ""; }
  function render() {
    document.getElementById("lista").innerHTML = N.filter(function (n) { return !filtro || n[1] === filtro; }).map(function (n) {
      var novo = lidas.indexOf(n[0]) < 0, foto = n[5].indexOf("foto:") === 0;
      var attr = foto ? 'role="button" tabindex="0" data-open-photo="' + n[5].slice(5) + '"' : 'href="' + n[5] + '"';
      return "<" + (foto ? "div" : "a") + ' class="list-item nt' + (novo ? " novo" : "") + '" data-n="' + n[0] + '" ' + attr + '><span class="ico">' + ico(n[2]) + '</span><div class="grow"><div>' + n[3] + '</div><div class="small">' + n[4] + (novo ? ' · <span class="badge badge-accent plain">nova</span>' : "") + "</div></div></" + (foto ? "div" : "a") + ">";
    }).join("") || '<p class="small muted">Nada por aqui.</p>';
  }
  document.getElementById("lista").addEventListener("click", function (e) {
    var it = e.target.closest("[data-n]"); if (!it) return;
    if (lidas.indexOf(it.getAttribute("data-n")) < 0) { lidas.push(it.getAttribute("data-n")); salvar(); setTimeout(render, 50); }
  });
  document.getElementById("filtro").addEventListener("click", function (e) {
    var b = e.target.closest("[data-f]"); if (!b) return;
    filtro = b.getAttribute("data-f");
    this.querySelectorAll("[data-f]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    render();
  });
  document.getElementById("todas").addEventListener("click", function () { lidas = N.map(function (n) { return n[0]; }); salvar(); render(); C.toast("Todas marcadas como lidas"); });
  render();
});
</script>
</body></html>
