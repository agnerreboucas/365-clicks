<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>365 Clicks — Artigo</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<script src="calendario-365.js" defer></script>
<script src="desafios.js" defer></script>
<style>.artigo { max-width: 760px; margin: 0 auto; } .artigo h2 { margin-top: var(--sp-7); } .art-nav { display: flex; justify-content: space-between; margin-top: var(--sp-7); padding-top: var(--sp-4); border-top: 1px solid var(--c-line); font-weight: 600; } .art-nav a { text-decoration: none; }</style>
</head><body data-page="artigo">
<header data-shell><a class="logo" href="home.html">365·CLICKS</a></header>
<main>
<article class="artigo" id="art"></article>
</main>
<footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var D = window.Desafios; function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }var slug = function (v) { return v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-"); };
  function render() {
    var m = location.hash.match(/dia-(\d+)/), hoje = D.hoje().dia, n = m ? Math.min(365, Math.max(1, +m[1])) : hoje;
    var d = D.doDia(new Date(2025, 0, n)), futuro = n > hoje;
    var el = [["Técnica", "tecnica", d.tecnica], ["Enquadramento", "enquadramento", d.enquadramento], ["Linguagem", "linguagem", d.linguagem], [D.rotuloEquip(d.equipamento), "equipamento", d.equipamento]];
    document.title = "365 Clicks — " + d.artigo;
    document.getElementById("art").innerHTML =
      '<a class="small" href="blog.html">← Blog</a>' +
      '<span class="eyebrow" style="display:block;margin-top:16px">Fotografia na prática · artigo-base do dia ' + n + " · " + esc(d.ciclo) + "</span>" +
      '<h1 style="margin-top:6px">' + esc(d.artigo) + "</h1>" +
      '<p class="lead">' + esc(d.missao) + " O objetivo do dia é: " + esc(d.objetivo.toLowerCase()) + "</p>" +
      "<h2>A combinação do dia</h2><p>O desafio junta o tema <strong>" + esc(d.tema) + "</strong> com quatro escolhas. Cumpra pelo menos duas.</p>" +
      '<div class="stack" style="gap:12px">' + el.map(function (e) {
        var livre = e[2] === "Livre";
        return '<div class="panel"><span class="eyebrow">' + e[0] + "</span><h3 style=\"margin:4px 0\">" + esc(livre ? "Livre" : e[2]) + '</h3><p class="small" style="margin:0">' + esc(livre ? "Escolha o que fizer mais sentido para a sua foto." : D.definicao(e[1], e[2])) + "</p>" + (livre ? "" : '<a class="small" href="biblioteca.html#' + e[1] + "-" + slug(e[2]) + '">Saiba mais na Biblioteca →</a>') + "</div>";
      }).join("") + "</div>" +
      "<h2>Três ideias para começar</h2><ol>" + d.dicas.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>" +
      '<p class="small muted">As dicas são inspiração, não regras.</p>' +
      "<h2>Nos próximos anos</h2><ul>" + d.anos.map(function (x, i) { return "<li><strong>Ano " + (i + 1) + ":</strong> " + esc(x) + "</li>"; }).join("") + "</ul>" +
      '<div class="notice" style="margin:24px 0"><span>Texto-base montado a partir do calendário editorial. A curadoria completa este artigo com exemplos da comunidade, um fotógrafo de referência, um livro e um filme.</span></div>' +
      '<div class="cluster">' + (n === hoje ? '<a class="btn btn-primary" href="desafio-do-dia.html">Participar do desafio de hoje</a>' : futuro ? '<span class="badge badge-info">Desafio agendado para ' + d.inicio.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + "</span>" : '<a class="btn btn-secondary" href="calendario.html#dia-' + n + '">Ver este dia no calendário</a>') + "</div>" +
      '<nav class="art-nav">' + (n > 1 ? '<a href="#dia-' + (n - 1) + '">← Dia ' + (n - 1) + "</a>" : "<span></span>") + (n < 365 ? '<a href="#dia-' + (n + 1) + '">Dia ' + (n + 1) + " →</a>" : "") + "</nav>";
    window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", render);
  render();
});
</script>
</body></html>
