<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>365 Clicks — Gerador criativo</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<script src="calendario-365.js" defer></script>
<script src="desafios.js" defer></script>
<style>.eixo { display: flex; gap: var(--sp-3); align-items: center; } .eixo .grow { flex: 1; display: grid; gap: 4px; }</style>
</head><body data-page="gerador-ideias">
<header data-shell><a class="logo" href="home.html">365·CLICKS</a></header>
<main>
<span class="eyebrow">Foto Criativa</span>
<h1 style="margin-top:4px">Gerador criativo</h1>
<p>Sem ideia? Combine um tema com técnica, enquadramento, linguagem e equipamento. Trave o que quiser manter e sorteie o resto. As regras de compatibilidade da Matriz Criativa valem aqui também.</p>
<div class="split" style="margin-top:24px">
  <section class="stack" style="gap:12px" id="eixos"></section>
  <aside class="panel stack sticky" style="gap:12px" id="saida"></aside>
</div>
</main>
<footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var D = window.Desafios, CAL = D.calendario, C = window.C365; function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var TEMAS = CAL.dias.map(function (r) { return r[0]; }).filter(function (t, i, a) { return a.indexOf(t) === i; });
  var EIXOS = [["tema", "Tema", TEMAS], ["tecnica", "Técnica", CAL.tecnicas], ["enquadramento", "Enquadramento", CAL.enquadramentos], ["linguagem", "Linguagem", CAL.linguagens], ["equipamento", "Equipamento ou recurso", CAL.equipamentos]];
  var atual = {}, travado = {};
  function sortear(lista) { return lista[Math.floor(Math.random() * lista.length)]; }
  function aplicarRegras() {
    if (atual.enquadramento === "Close") atual.enquadramento = "Close ou plano detalhe";
    if (atual.linguagem === "Fotojornalística" && atual.equipamento === "Flash") atual.equipamento = "Foco e desfoque";
  }
  function girar() { EIXOS.forEach(function (e) { if (!travado[e[0]]) atual[e[0]] = sortear(e[2].filter(function (v) { return e[0] === "tema" || v !== "Livre"; })); }); aplicarRegras(); render(); }
  function render() {
    document.getElementById("eixos").innerHTML = EIXOS.map(function (e) {
      return '<div class="panel eixo"><div class="grow"><span class="eyebrow">' + e[1] + '</span><label class="sr-only" for="ex-' + e[0] + '">' + e[1] + '</label><select class="select" id="ex-' + e[0] + '" data-eixo="' + e[0] + '">' + e[2].concat(e[0] === "enquadramento" ? ["Close ou plano detalhe"] : []).filter(function (v, i, a) { return a.indexOf(v) === i; }).map(function (v) { return "<option" + (v === atual[e[0]] ? " selected" : "") + ">" + esc(v) + "</option>"; }).join("") + '</select><span class="small muted">' + esc(e[0] === "tema" ? "" : D.definicao(e[0], atual[e[0]])) + '</span></div><button class="btn btn-ghost btn-sm" type="button" data-travar="' + e[0] + '" aria-pressed="' + !!travado[e[0]] + '">' + (travado[e[0]] ? "Travado" : "Travar") + "</button></div>";
    }).join("") + '<button class="btn btn-primary btn-lg" type="button" id="girar">Sortear de novo</button>';
    var tl = atual.tema.toLowerCase();
    document.getElementById("saida").innerHTML = '<span class="eyebrow">Sua proposta</span><h2 style="margin:0">' + esc(atual.tema) + '</h2><p class="small" style="margin:0">Crie uma fotografia a partir do tema “' + esc(atual.tema) + "”, com " + esc(atual.tecnica.toLowerCase()) + ", " + esc(atual.enquadramento.toLowerCase()) + ", linguagem " + esc(atual.linguagem.toLowerCase()) + " e " + esc(atual.equipamento.toLowerCase()) + '.</p><div class="cluster" style="gap:6px">' + [atual.tecnica, atual.enquadramento, atual.linguagem, atual.equipamento].map(function (v) { return '<span class="chip" style="cursor:default">' + esc(v) + "</span>"; }).join("") + '</div><span class="eyebrow">Inspiração</span><ul class="small" style="margin:0;padding-left:18px"><li>Observe onde “' + esc(tl) + '” aparece de maneira inesperada.</li><li>Mude distância, altura ou ponto de vista antes de apertar o disparador.</li></ul><div class="cluster"><button class="btn btn-secondary btn-sm" type="button" id="salvar">Salvar ideia</button><a class="btn btn-sm" href="publicar.html">Fotografar e publicar</a></div><div id="salvas"></div>';
    renderSalvas();
  }
  function salvas() { try { return JSON.parse(localStorage.getItem("c365-ideias") || "[]"); } catch (e) { return []; } }
  function renderSalvas() { var l = salvas(); document.getElementById("salvas").innerHTML = l.length ? '<span class="eyebrow">Ideias salvas</span><ul class="small" style="margin:6px 0 0;padding-left:18px">' + l.slice(0, 5).map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>" : ""; }
  document.addEventListener("click", function (e) {
    if (e.target.id === "girar") girar();
    var t = e.target.closest("[data-travar]"); if (t) { var k = t.getAttribute("data-travar"); travado[k] = !travado[k]; render(); }
    if (e.target.id === "salvar") { var l = salvas(); l.unshift([atual.tema, atual.tecnica, atual.enquadramento, atual.linguagem, atual.equipamento].join(" + ")); try { localStorage.setItem("c365-ideias", JSON.stringify(l.slice(0, 20))); } catch (x) {} renderSalvas(); C.toast("Ideia salva"); }
  });
  document.addEventListener("change", function (e) { var k = e.target.getAttribute && e.target.getAttribute("data-eixo"); if (k) { atual[k] = e.target.value; travado[k] = true; aplicarRegras(); render(); } });
  girar();
});
</script>
</body></html>
