<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Clicks — Central de Ajuda</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<style>
.faq details { border-bottom: 1px solid var(--line); padding: var(--sp-3) 0; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq p { margin: var(--sp-2) 0 0; }
.faq h2 { margin-top: var(--sp-6); }
</style></head><body data-page="ajuda">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main style="max-width:820px">
<h1>Central de Ajuda</h1>
<p>Respostas rápidas sobre o desafio, as suas fotos, pagamentos e a sua conta.</p>
<div class="search-field" style="margin:20px 0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr-only" for="q">Buscar na ajuda</label><input class="input" id="q" placeholder="Ex.: horário do desafio, cancelar, direitos"></div>
<div class="faq" id="faq"></div>
<p class="small muted" id="nada" hidden>Nada encontrado. <a href="contato.html">Fale com a equipe</a>.</p>
<div class="panel cluster" style="margin-top:32px;justify-content:space-between"><div><strong>Não achou?</strong><div class="small">Respondemos em até 1 dia útil.</div></div><a class="btn btn-secondary" href="contato.html">Falar com a equipe</a></div>
</main><footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer><script>
document.addEventListener("DOMContentLoaded", function () {
  var G = [
    ["O desafio 365", [
      ["Que horas sai o desafio e até quando posso publicar?", "O desafio do dia é liberado às 00:00:00 e fecha às 23:59:59 (horário de Brasília). A semana começa no domingo (dia 1) e os desafios da semana seguinte já ficam visíveis com antecedência em <a href='desafios.html'>Desafios 365</a>."],
      ["A foto precisa ser feita no mesmo dia?", "Sim. A data de captura (EXIF) precisa ser a do desafio. Fotos sem data entram como publicação livre e não pontuam no ranking."],
      ["Quantas características preciso cumprir?", "Pelo menos 2 das 4: técnica, enquadramento, linguagem e equipamento ou recurso. Cada característica vale 2 pontos e publicar no próprio dia vale mais 2, até 10 por dia."],
      ["Perdi um dia. Perco tudo?", "Não. A sequência zera, mas os pontos e os dias publicados continuam. Você acompanha tudo em <a href='meus-desafios.html'>Meus desafios</a>."]
    ]],
    ["Minhas fotos e direitos", [
      ["As minhas fotos podem ser baixadas?", "Só do jeito que você permitir. O visualizador bloqueia download, cópia e impressão. Você escolhe se libera o download grátis da versão web para uso pessoal (Creative Commons BY-NC, com crédito) e se vende a licença comercial com o arquivo original."],
      ["Como vendo as minhas fotos?", "Ao publicar, defina o preço da licença comercial e as licenças. Depois ajuste tudo em <a href='vendas.html#precos'>Meus ganhos</a>, onde também ficam seu saldo, as fotos vendidas e a conta para receber. Nas vendas pela plataforma você recebe 80% por Pix; pelo WhatsApp, a negociação é direta e 100% sua."],
      ["Alguém quer comprar a minha foto. E agora?", "O interessado preenche o contato na foto e você recebe em <a href='mensagens.html#interessados'>Mensagens → Interessados</a>. A negociação é entre vocês; a plataforma não cobra comissão."],
      ["Qual o tamanho ideal para enviar?", "Qualquer foto até 25 MB. O 365 Clicks gera versões WebP leves e nítidas automaticamente, nos formatos vertical, horizontal e quadrado."],
      ["Como aprovo ou denuncio comentários?", "Em <a href='editar-perfil.html#s-privacidade'>Editar perfil</a> você escolhe aprovar antes de publicar. Em cada comentário há Aprovar, Editar (se for seu) e Denunciar."]
    ]],
    ["Pagamentos", [
      ["Quais planos existem?", "Free, 365 e Clube. Compare em <a href='planos.html'>Planos</a>."],
      ["Como cancelo a assinatura?", "Em <a href='minha-assinatura.html'>Minha assinatura</a>, a qualquer momento. Você mantém o acesso até o fim do período pago."],
      ["Posso cancelar um ingresso?", "Sim, em <a href='meus-ingressos.html'>Meus ingressos</a>, seguindo a política de cancelamento de cada evento em <a href='termos.html'>Termos</a>."],
      ["Quero anunciar a minha marca", "Veja os espaços e preços em <a href='anuncie.html'>Anuncie</a>. A cobrança é mensal."]
    ]],
    ["Conta e privacidade", [
      ["Onde baixo o que comprei?", "Em <a href='downloads.html'>Meus downloads</a>: fotos licenciadas, fotos grátis que você baixou, e-books, cursos e roteiros. Baixe de novo quantas vezes quiser."],
      ["Como recebo o dinheiro das minhas vendas?", "Vincule uma conta de recebimento em <a href='vendas.html#conta'>Meus ganhos → Conta de recebimento</a> (CPF ou CNPJ e chave Pix). Cada venda é dividida na hora (80% seu), fica 30 dias a liberar e depois vai para o seu Pix."],
      ["Como troco e-mail ou senha?", "Em <a href='configuracoes.html#conta'>Configurações → Conta</a>."],
      ["Recebo e-mails demais", "Escolha o que chega por e-mail em <a href='configuracoes.html#notificacoes'>Configurações → Notificações</a> ou mude para resumo diário ou semanal."],
      ["Como baixo ou excluo os meus dados?", "Em <a href='configuracoes.html#dados'>Configurações → Meus dados (LGPD)</a>."]
    ]]
  ];
  var box = document.getElementById("faq");
  box.innerHTML = G.map(function (g) { return '<section><h2>' + g[0] + "</h2>" + g[1].map(function (q) { return "<details><summary>" + q[0] + "</summary><p>" + q[1] + "</p></details>"; }).join("") + "</section>"; }).join("");
  document.getElementById("q").addEventListener("input", function () {
    var v = this.value.trim().toLowerCase(), n = 0;
    box.querySelectorAll("details").forEach(function (d) { var ok = !v || d.textContent.toLowerCase().indexOf(v) > -1; d.hidden = !ok; d.open = !!v && ok; if (ok) n++; });
    box.querySelectorAll("section").forEach(function (s) { s.hidden = !s.querySelector("details:not([hidden])"); });
    document.getElementById("nada").hidden = !!n;
  });
});
</script>
</body></html>
