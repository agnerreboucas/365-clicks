<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Clicks — Meus cursos</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="ofertas.js"></script>
<script src="../design-system/app.js" defer></script>
<style>
.mc { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--sp-4); margin-top: var(--sp-5); }
.mc .panel { display: flex; flex-direction: column; gap: var(--sp-3); padding: 0; overflow: hidden; }
.mc .capa { aspect-ratio: 16/7; background-size: cover; background-position: center; }
.mc .body { padding: 0 var(--sp-5) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); }
</style></head><body data-page="meus-cursos">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main>
<h1>Meus cursos</h1>
<p>Continue de onde parou. O progresso é salvo a cada aula concluída.</p>
<div class="mc" id="mc"></div>
<div class="panel cluster" style="margin-top:32px;justify-content:space-between"><div><strong>Quer aprender mais?</strong><div class="small">Assinantes do Clube têm 1 curso por trimestre incluso e 20% de desconto nos demais.</div></div><a class="btn btn-secondary" href="cursos.html">Ver todos os cursos</a></div>
</main><footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer><script>
document.addEventListener("DOMContentLoaded", function () {
  var O = window.Ofertas, esc = O.esc;
  var prog; try { prog = JSON.parse(localStorage.getItem("c365-cursos") || "null"); } catch (e) {}
  prog = prog || { "curso-fotografia-de-rua": [1, 2, 3], "curso-celular": [1, 2, 3, 4, 5] };
  document.getElementById("mc").innerHTML = Object.keys(prog).filter(function (k) { return O.lista[k]; }).map(function (k) {
    var o = O.lista[k], tot = o.programacao.length, feitas = prog[k].length, pct = Math.round(feitas / tot * 100);
    var prox = 1; while (prog[k].indexOf(prox) > -1 && prox <= tot) prox++;
    var fim = feitas >= tot;
    return '<article class="panel"><div class="capa" style="background-image:url(\'' + o.img + "'),linear-gradient(160deg," + o.tone2 + "," + o.tone + ')"></div><div class="body">' +
      '<span class="eyebrow">' + esc(o.categoria) + "</span><h2 style='margin:0'>" + esc(o.titulo) + "</h2>" +
      '<div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><span style="--value:' + pct + '%"></span></div>' +
      '<span class="small mono">' + feitas + " de " + tot + " aulas · " + pct + "%</span>" +
      (fim ? '<span class="small">Concluído. Certificado disponível.</span><div class="cluster"><button class="btn btn-secondary btn-sm" type="button" data-toast="Certificado enviado para o seu e-mail (PDF)">Baixar certificado</button><a class="btn btn-ghost btn-sm" href="aula.html#' + k + '/1">Rever aulas</a></div>'
        : '<span class="small">Próxima: <b>' + esc(o.programacao[prox - 1][1]) + "</b> · " + esc(o.programacao[prox - 1][2]) + '</span><a class="btn btn-primary" href="aula.html#' + k + "/" + prox + '" style="align-self:flex-start">Continuar</a>') +
      "</div></article>";
  }).join("");
});
</script>
</body></html>
