<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Clicks — Conquistas</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<style>
.cq { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-3); }
.cq .panel { display: flex; flex-direction: column; gap: 6px; }
.cq .panel.off { opacity: .6; }
.cq .seal { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }
.cq .panel:not(.off) .seal { background: var(--accent); color: #fff; }
</style></head><body data-page="conquistas">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main>
<span class="eyebrow">365 Challenge</span>
<h1>Conquistas</h1>
<p style="max-width:66ch">Selos que marcam a sua evolução. Aparecem no seu perfil público. Nenhum depende de curtidas: todos vêm da prática.</p>
<div class="row" style="margin:24px 0"><div class="panel stat"><span class="small">Conquistadas</span><div class="metric" id="n-ok">—</div></div><div class="panel stat"><span class="small">Em andamento</span><div class="metric" id="n-and">—</div></div><div class="panel stat"><span class="small">Dias publicados</span><div class="metric">127</div></div></div>
<div id="grupos"></div>
</main><footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer><script>
document.addEventListener("DOMContentLoaded", function () {
  var C = window.C365;
  /* [nome, como ganhar, atual, meta] — dados do usuário de exemplo (127 dias, sequência de 12) */
  var G = [
    ["Constância", [["Primeiro click", "Publicar a primeira foto do 365", 127, 1], ["Semana completa", "7 dias seguidos", 12, 7], ["Um mês de olhar", "30 dias seguidos", 12, 30], ["Centenário", "100 dias publicados", 127, 100], ["Meio caminho", "183 dias publicados", 127, 183], ["Ano completo", "365 dias publicados", 127, 365]]],
    ["Técnica", [["Primeira pontuação máxima", "Cumprir as 4 características em um dia", 1, 1], ["Dez perfeitos", "10 dias com 10 pontos", 6, 10], ["Explorador", "Publicar em todos os ciclos do calendário", 5, 12], ["Noite adentro", "5 desafios de longa exposição", 2, 5]]],
    ["Comunidade", [["Primeira conversa", "Receber o primeiro comentário", 1, 1], ["Olhar generoso", "Comentar em 50 fotos de outras pessoas", 31, 50], ["Rede", "Ser marcado por 10 fotógrafos diferentes", 4, 10], ["Presença", "Participar de um encontro ou evento", 1, 1]]],
    ["Autoria", [["Primeiro projeto", "Publicar uma série em Projetos", 1, 1], ["História contada", "Ter um texto aprovado em “A foto que eu nunca tirei”", 0, 1], ["Primeiro negócio", "Fechar uma venda ou licença pelo contato", 0, 1]]]
  ];
  var ok = 0, and = 0;
  document.getElementById("grupos").innerHTML = G.map(function (g) {
    return '<h2 style="margin-top:32px">' + g[0] + '</h2><div class="cq">' + g[1].map(function (c) {
      var feito = c[2] >= c[3], pct = Math.min(100, Math.round(c[2] / c[3] * 100));
      if (feito) ok++; else if (c[2] > 0) and++;
      return '<div class="panel' + (feito ? "" : " off") + '"><span class="seal">' + C.icon(feito ? "star" : "target", "i-sm") + '</span><strong>' + c[0] + '</strong><span class="small">' + c[1] + "</span>" +
        (feito ? '<span class="badge badge-success plain">Conquistada</span>' : '<div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><span style="--value:' + pct + '%"></span></div><span class="small mono">' + c[2] + " de " + c[3] + "</span>") + "</div>";
    }).join("") + "</div>";
  }).join("");
  document.getElementById("n-ok").textContent = ok;
  document.getElementById("n-and").textContent = and;
});
</script>
</body></html>
