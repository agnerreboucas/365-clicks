<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>365 Clicks — Calendário 365</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<script src="calendario-365.js" defer></script>
<script src="desafios.js" defer></script>
<style>.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dia { display: grid; gap: 2px; align-content: start; min-height: 64px; padding: 6px; text-align: left; border: 1px solid var(--c-line); border-radius: var(--r-sm); background: var(--c-surface); cursor: pointer; font: inherit; color: var(--c-ink); }
.cal-dia .n { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--c-muted); }
.cal-dia .t { font-size: 12px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cal-dia.passado { background: var(--c-surface-2); }
.cal-dia.hoje { border-color: var(--c-accent); box-shadow: inset 0 0 0 1.5px var(--c-accent); }
.cal-dia.fora { opacity: .25; }
.cal-dia[aria-pressed="true"] { border-color: var(--c-ink); box-shadow: inset 0 0 0 1.5px var(--c-ink); }
.cal-dia:hover { border-color: var(--c-ink); }
@media (max-width: 640px) { .cal-dia .t { display: none; } .cal-dia { min-height: 40px; } }</style>
</head><body data-page="calendario">
<header data-shell><a class="logo" href="home.html">365·CLICKS</a></header>
<main>
<span class="eyebrow">365 Challenge</span>
<h1 style="margin-top:4px">Calendário dos 365 desafios</h1>
<p>Um desafio por dia, organizado em 24 ciclos. Clique num dia para ver o desafio completo.</p>
<div class="cluster" style="margin:16px 0"><form class="search-field" role="search" id="busca" style="flex:1;min-width:220px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr-only" for="q-cal">Buscar tema</label><input class="input" id="q-cal" type="search" placeholder="Buscar tema, técnica ou linguagem"></form>
<label class="sr-only" for="f-ciclo">Ciclo</label><select class="select" id="f-ciclo" style="width:auto"><option value="">Todos os ciclos</option></select></div>
<div class="split"><div id="meses" class="stack" style="gap:28px"></div><aside class="panel stack sticky" id="dia" style="gap:10px"></aside></div>
</main>
<footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var D = window.Desafios, CAL = D.calendario, hoje = D.hoje().dia; function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  CAL.ciclos.forEach(function (c, i) { document.getElementById("f-ciclo").insertAdjacentHTML("beforeend", '<option value="' + i + '">' + esc(c) + "</option>"); });
  function render() {
    var q = document.getElementById("q-cal").value.trim().toLowerCase(), ci = document.getElementById("f-ciclo").value;
    var html = "";
    for (var m = 0; m < 12; m++) {
      var dias = [], ini = new Date(2025, m, 1), fim = new Date(2025, m + 1, 0).getDate();
      for (var dd = 1; dd <= fim; dd++) {
        var n = Math.round((new Date(2025, m, dd) - new Date(2025, 0, 1)) / 864e5) + 1, r = CAL.dias[n - 1];
        var txt = (r[0] + " " + CAL.tecnicas[r[3]] + " " + CAL.linguagens[r[5]] + " " + CAL.enquadramentos[r[4]]).toLowerCase();
        var ok = (!q || txt.indexOf(q) > -1) && (ci === "" || +ci === r[1]);
        dias.push('<button type="button" class="cal-dia' + (n === hoje ? " hoje" : n < hoje ? " passado" : "") + (ok ? "" : " fora") + '" data-dia="' + n + '"><span class="n">' + dd + '</span><span class="t">' + esc(r[0]) + "</span></button>");
      }
      html += "<section><h2 style=\"margin:0 0 10px\">" + MESES[m] + '</h2><div class="cal-grid">' + '<span class="cal-pad" style="grid-column:span ' + ini.getDay() + '"></span>'.repeat(ini.getDay() ? 1 : 0) + dias.join("") + "</div></section>";
    }
    document.getElementById("meses").innerHTML = html;
  }
  function mostrar(n) {
    var d = D.doDia(new Date(2025, 0, n));
    document.getElementById("dia").innerHTML = '<span class="eyebrow">Dia ' + n + " · " + d.inicio.toLocaleDateString("pt-BR", { day: "2-digit", month: "long" }) + '</span><span class="tag" style="align-self:flex-start">' + esc(d.ciclo) + '</span><h2 style="margin:0">' + esc(d.tema) + '</h2><p class="small" style="margin:0">' + esc(d.missao) + '</p><ol class="small" style="margin:0;padding-left:18px">' + d.caracteristicas.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + '</ol><div class="cluster">' + (n === hoje ? '<a class="btn btn-primary btn-sm" href="desafio-do-dia.html">Desafio de hoje</a>' : "") + '<a class="btn btn-secondary btn-sm" href="artigo.html#dia-' + n + '">Artigo-base</a></div>';
    document.querySelectorAll(".cal-dia").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.getAttribute("data-dia") === n)); });
  }
  document.getElementById("meses").addEventListener("click", function (e) { var b = e.target.closest("[data-dia]"); if (b) { mostrar(+b.getAttribute("data-dia")); history.replaceState(null, "", "#dia-" + b.getAttribute("data-dia")); } });
  document.getElementById("q-cal").addEventListener("input", render);
  document.getElementById("busca").addEventListener("submit", function (e) { e.preventDefault(); });
  document.getElementById("f-ciclo").addEventListener("change", render);
  render();
  var m0 = location.hash.match(/dia-(\d+)/), n0 = m0 ? +m0[1] : hoje;
  mostrar(n0);
  var alvo = document.querySelector('[data-dia="' + n0 + '"]'); if (alvo) alvo.scrollIntoView({ block: "center" });
});
</script>
</body></html>
