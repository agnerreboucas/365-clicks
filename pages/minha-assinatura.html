<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>365 Clicks — Minha assinatura</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="planos-dados.js"></script>
<script src="../design-system/app.js" defer></script>
</head><body data-page="minha-assinatura">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main>
<h1>Minha assinatura</h1>
<div class="split" style="margin-top:24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start" id="wrap">
  <div class="stack">
    <div class="panel stack" id="plano"></div>
    <div class="panel stack">
      <h2 style="margin:0">Cobranças</h2>
      <div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Forma</th><th class="num">Valor</th><th>Nota</th></tr></thead><tbody id="cob"></tbody></table></div>
    </div>
  </div>
  <aside class="stack">
    <div class="panel stack"><h3 style="margin:0">Trocar de plano</h3><div class="stack" id="trocar" style="gap:8px"></div></div>
    <div class="panel stack"><h3 style="margin:0">Cancelar</h3><p class="small" style="margin:0">Você mantém o acesso até o fim do período pago. As suas fotos e o seu histórico no 365 continuam no perfil.</p><button class="btn btn-danger btn-sm" type="button" id="cancelar" style="align-self:flex-start">Cancelar assinatura</button></div>
  </aside>
</div>
</main><footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer><script>
document.addEventListener("DOMContentLoaded", function () {
  var P = window.Planos, C = window.C365, a = P.atual(), p = P.lista[a.plano] || P.lista["365"];
  function salvar() { try { localStorage.setItem("c365-assinatura", JSON.stringify(a)); } catch (e) {} }
  function prox() { var d = new Date(); d.setMonth(d.getMonth() + (a.ciclo === "anual" ? 12 : 1)); d.setDate(12); return d.toLocaleDateString("pt-BR"); }
  function render() {
    p = P.lista[a.plano] || P.lista["365"];
    var cancelada = a.status === "cancelada", free = a.plano === "free";
    document.getElementById("plano").innerHTML = '<div class="cluster" style="justify-content:space-between"><div><span class="eyebrow">Plano atual</span><h2 style="margin:4px 0 0">' + p.nome + (free ? "" : " · " + (a.ciclo === "anual" ? "anual" : "mensal")) + '</h2></div><span class="badge ' + (cancelada ? "badge-danger" : a.status === "ativa" ? "badge-success" : "badge-warning") + '">' + a.status + "</span></div>" +
      '<dl class="kv" style="grid-template-columns:auto 1fr">' + (free ? "<dt>Valor</dt><dd style='text-align:left'>Gratuito</dd>" : "<dt>Valor</dt><dd style='text-align:left'>" + P.brl(p[a.ciclo === "anual" ? "anual" : "mensal"]) + (a.ciclo === "anual" ? " por ano" : " por mês") + "</dd><dt>" + (cancelada ? "Acesso até" : "Próxima cobrança") + "</dt><dd style='text-align:left'>" + prox() + "</dd><dt>Pagamento</dt><dd style='text-align:left'>" + (a.pagamento || "—") + ' · <a href="#" data-toast="Na versão real, abre a troca do cartão no gateway">trocar</a></dd>') + "<dt>Assinante desde</dt><dd style='text-align:left'>" + (a.desde || "—") + "</dd></dl>" +
      '<ul class="small" style="margin:0;padding-left:1.1em;display:grid;gap:4px">' + p.itens.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>" +
      (cancelada ? '<button class="btn btn-primary btn-sm" type="button" id="reativar" style="align-self:flex-start">Reativar assinatura</button>' : "");
    var v = free ? 0 : p[a.ciclo === "anual" ? "anual" : "mensal"], meses = ["12/09/2026", "12/08/2026", "12/07/2026", "12/06/2026"];
    document.getElementById("cob").innerHTML = free ? '<tr><td colspan="5" class="small muted">Sem cobranças no plano Free.</td></tr>' : (a.ciclo === "anual" ? [a.desde || "12/03/2026"] : meses).map(function (d) {
      return "<tr><td class='mono'>" + d + "</td><td>Plano " + p.nome + "</td><td>" + (a.pagamento || "Cartão") + '</td><td class="num">' + P.brl(v) + '</td><td><a href="#" data-toast="Nota fiscal enviada para o seu e-mail">PDF</a></td></tr>';
    }).join("");
    document.getElementById("trocar").innerHTML = Object.keys(P.lista).filter(function (k) { return k !== a.plano; }).map(function (k) {
      var q = P.lista[k];
      return k === "free" ? '<button class="btn btn-secondary btn-sm" type="button" data-free>Voltar para o Free</button>' : '<a class="btn btn-secondary btn-sm" href="checkout.html#' + k + "-" + (a.ciclo || "mensal") + '">Mudar para ' + q.nome + " · " + P.brl(q.mensal) + "/mês</a>";
    }).join("") + '<a class="small" href="planos.html">Comparar planos →</a>';
    document.getElementById("cancelar").hidden = cancelada || free;
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest("#cancelar")) {
      if (!confirm("Cancelar a assinatura? Você mantém o acesso até " + prox() + ".")) return;
      a.status = "cancelada"; salvar(); render(); C.toast("Assinatura cancelada. Enviamos a confirmação por e-mail.");
    } else if (e.target.closest("#reativar")) {
      a.status = "ativa"; salvar(); render(); C.toast("Assinatura reativada");
    } else if (e.target.closest("[data-free]")) {
      if (!confirm("Voltar para o Free no fim do período pago?")) return;
      a = { plano: "free", ciclo: "mensal", desde: a.desde, status: "ativa" }; salvar(); render(); C.toast("Você volta para o Free no fim do período pago");
    }
  });
  render();
  if (matchMedia("(max-width: 860px)").matches) document.getElementById("wrap").style.gridTemplateColumns = "1fr";
});
</script>
</body></html>
