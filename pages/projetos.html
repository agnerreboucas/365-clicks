<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>365 Clicks — Projetos</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
<script src="../design-system/upload.js" defer></script>
<script src="fotos.js" defer></script>
</head><body data-page="projetos">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main>
<div class="cluster" style="justify-content:space-between;align-items:flex-end">
  <div><h1>Projetos</h1><p style="margin:0">Séries autorais com nome, conceito e fotos próprias. Um projeto pode virar parte do seu portfólio, se você quiser.</p></div>
  <button class="btn btn-primary" type="button" id="novo">+ Novo projeto</button>
</div>

<form class="panel" id="form" hidden novalidate style="margin-top:24px">
  <h2 style="margin-top:0">Novo projeto</h2>
  <div class="form-grid">
    <div class="field col-4"><label class="label" for="p-nome">Nome do projeto<span class="req">*</span></label><input class="input" id="p-nome" maxlength="80" required placeholder="Ex.: Mulheres da Feira"></div>
    <div class="field col-2"><label class="label" for="p-vis">Visibilidade</label><select class="select" id="p-vis"><option>Público</option><option>Só com link</option><option>Rascunho (só eu)</option></select></div>
    <div class="field col-6"><label class="label" for="p-conceito">Conceito<span class="req">*</span></label><textarea class="textarea" id="p-conceito" rows="5" maxlength="2000" required placeholder="Sobre o que é o projeto, por que você fotografa isso e o que quer que as pessoas sintam."></textarea><span class="hint"><span id="p-cont">0</span>/2000 · aparece no topo da página do projeto.</span></div>
    <div class="field col-3"><label class="label" for="p-local">Onde</label><input class="input" id="p-local" placeholder="Ex.: Feira da Kantuta, São Paulo"></div>
    <div class="field col-3"><label class="label" for="p-periodo">Período</label><input class="input" id="p-periodo" placeholder="Ex.: mar–set 2026"></div>
  </div>
  <label class="switch" style="margin:20px 0"><input type="checkbox" id="p-portf" checked> Mostrar este projeto no meu portfólio</label>
  <fieldset class="fieldset" style="margin-bottom:16px">
    <legend>Fotos do projeto</legend>
    <label class="drop-mini" for="p-fotos"><input type="file" id="p-fotos" accept="image/jpeg,image/png" multiple><strong>Adicionar fotos</strong><span class="small">Várias de uma vez. Até 25 MB cada. Convertidas para WebP e carregadas leves no site.</span></label>
    <button class="btn btn-ghost btn-sm" type="button" id="p-exemplo" style="margin-top:8px">Adicionar fotos de exemplo</button>
    <div class="proj-fotos" id="p-lista"></div>
  </fieldset>
  <label class="accept"><input type="checkbox" id="p-autoria" required><span>Declaro que sou <strong>autor ou coautor de todas as fotos</strong> deste projeto e que tenho autorização das pessoas retratadas.</span></label>
  <div class="step-foot" style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button class="btn btn-ghost" type="button" id="cancelar">Cancelar</button><button class="btn btn-primary" type="submit">Criar projeto</button></div>
</form>

<div class="offers" id="projetos" style="margin-top:28px"></div>
</main>
<footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer>
<style>
.drop-mini { position: relative; display: grid; gap: 4px; padding: var(--sp-5); border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); cursor: pointer; text-align: center; }
.drop-mini:hover { border-color: var(--ink); }
.drop-mini input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.proj-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-4); }
.proj-foto { display: grid; gap: 6px; }
.proj-foto .ph { aspect-ratio: var(--ratio, 1); border-radius: var(--r-sm); background-size: cover; background-position: center; background-color: var(--surface-2); }
.proj-foto .input { min-height: 34px; padding: 6px 10px; font-size: var(--fs-sm); }
.offer .cover .n { position: absolute; right: var(--sp-3); bottom: var(--sp-3); }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var C = window.C365, F = window.Fotos, U = C.upload, $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var EXEMPLOS = [
    { slug: "projeto.html", nome: "São Paulo Invisível", conceito: "As pessoas que a cidade não vê: quem varre, entrega, vigia e cozinha antes de São Paulo acordar.", fotos: 24, vis: "Público", portf: true, img: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&h=506&q=80", tone: "#4f4336", tone2: "#c09a6c" },
    { slug: "projeto.html", nome: "Água que corre", conceito: "Um ano fotografando o mesmo rio em todas as estações.", fotos: 12, vis: "Só com link", portf: false, img: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&h=506&q=80", tone: "#304131", tone2: "#a2b298" }
  ];
  function salvos() { try { return JSON.parse(localStorage.getItem("c365-projetos") || "[]"); } catch (e) { return []; } }
  function render() {
    var lista = salvos().concat(EXEMPLOS);
    $("#projetos").innerHTML = lista.map(function (p) {
      return '<a class="offer" href="' + (p.slug || "projeto.html") + '"><div class="cover" style="--img:url(\'' + p.img + '\');--tone:' + p.tone + ";--tone2:" + p.tone2 + '"><span class="badge ' + (p.vis === "Público" ? "badge-success" : "") + ' plain">' + esc(p.vis) + '</span><span class="badge plain n">' + p.fotos + " fotos</span></div>" +
        '<div><h3>' + esc(p.nome) + '</h3><div class="small">' + esc(p.conceito.slice(0, 120)) + (p.conceito.length > 120 ? "…" : "") + "</div>" + (p.portf ? '<span class="badge badge-accent plain" style="margin-top:6px">No portfólio</span>' : "") + "</div></a>";
    }).join("");
  }
  render();
  $("#novo").addEventListener("click", function () { $("#form").hidden = false; $("#p-nome").focus(); });
  $("#cancelar").addEventListener("click", function () { $("#form").hidden = true; });
  $("#p-conceito").addEventListener("input", function () { $("#p-cont").textContent = this.value.length; });

  var fotos = [];
  function addFoto(src, bytes, simulado) {
    var item = { src: src, url: src, titulo: "" }, i = fotos.push(item) - 1;
    renderFotos();
    U.carregarImagem(src).then(function (img) {
      var f = U.sugerir(img.naturalWidth, img.naturalHeight);
      item.formato = f;
      return U.processar(src, f).catch(function () { return U.estimar(f); }).then(function (r) { if (r.url) item.url = r.versoes[2].url; item.info = U.FORMATOS[f].nome + " · " + r.tipo + " · galeria " + U.mb(r.versoes[2].bytes) + (r.estimado ? " (est.)" : ""); });
    }).catch(function () { item.formato = "horizontal"; item.info = "Horizontal · WebP · galeria ~135 KB (est.)"; }).then(renderFotos);
  }
  function renderFotos() {
    $("#p-lista").innerHTML = fotos.map(function (f, i) {
      var r = f.formato ? U.FORMATOS[f.formato].ratio : "1/1";
      return '<div class="proj-foto"><div class="ph protected" style="--ratio:' + r + ";background-image:url('" + f.url + "')\"></div>" +
        '<label class="sr-only" for="pf-' + i + '">Legenda da foto ' + (i + 1) + '</label><input class="input" id="pf-' + i + '" data-i="' + i + '" placeholder="Legenda" value="' + esc(f.titulo) + '"><span class="mono">' + (f.info || "Ajustando…") + "</span></div>";
    }).join("");
  }
  $("#p-lista").addEventListener("input", function (e) { var i = e.target.getAttribute("data-i"); if (i != null) fotos[+i].titulo = e.target.value; });
  $("#p-fotos").addEventListener("change", function () {
    Array.prototype.forEach.call(this.files, function (file) {
      if (!/^image\//.test(file.type)) return;
      addFoto(URL.createObjectURL(file), file.size);
    });
    this.value = "";
  });
  $("#p-exemplo").addEventListener("click", function () {
    F.lista.slice(0, 4).forEach(function (f) { addFoto(f.thumb, 0, true); });
  });
  $("#form").addEventListener("submit", function (e) {
    e.preventDefault();
    var bad = [];
    ["p-nome", "p-conceito"].forEach(function (id) { var el = document.getElementById(id); el.removeAttribute("aria-invalid"); if (!el.value.trim()) { el.setAttribute("aria-invalid", "true"); bad.push(el); } });
    if (!fotos.length) { C.toast("Adicione pelo menos uma foto ao projeto"); if (!bad.length) return; }
    var a = $("#p-autoria"); a.closest(".accept").removeAttribute("aria-invalid");
    if (!a.checked) { a.closest(".accept").setAttribute("aria-invalid", "true"); bad.push(a); }
    if (bad.length || !fotos.length) { if (bad[0]) bad[0].focus(); return; }
    var lista = salvos();
    lista.unshift({ nome: $("#p-nome").value.trim(), conceito: $("#p-conceito").value.trim(), fotos: fotos.length, vis: $("#p-vis").value, portf: $("#p-portf").checked, img: fotos[0].src, tone: "#2c2c2a", tone2: "#6a6a64" });
    try { localStorage.setItem("c365-projetos", JSON.stringify(lista.slice(0, 20))); } catch (x) {}
    fotos = []; renderFotos(); $("#form").reset(); $("#form").hidden = true; render();
    C.toast("Projeto criado" + ($("#p-portf").checked ? " e adicionado ao portfólio" : ""));
  });
});
</script>
</body></html>
