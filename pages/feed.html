<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>365 Clicks — Feed</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/app.js" defer></script>
</head><body data-page="feed">
<header data-shell><a class="logo" href="home.html">365 Clicks</a></header>
<main>
<div class="feed-bar">
  <div class="grow"><h1 style="margin:0">Feed</h1><p style="margin:0">Fotos de quem você segue. Role para o lado; o feed não acaba.</p></div>
  <span class="small num" id="feed-count" aria-live="polite"></span>
  <button class="btn btn-secondary btn-icon" type="button" id="feed-prev" aria-label="Fotos anteriores"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(90deg)"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="btn btn-secondary btn-icon" type="button" id="feed-next" aria-label="Próximas fotos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(-90deg)"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<div class="chips" style="margin-top:4px"><button class="chip" type="button" aria-pressed="true">Seguindo</button><button class="chip" type="button" aria-pressed="false">Desafio do dia</button><button class="chip" type="button" aria-pressed="false">Mais curtidas</button><button class="chip" type="button" aria-pressed="false">Perto de mim</button></div>
<div class="feed" id="feed" data-feed tabindex="0" aria-label="Feed de fotografias, role na horizontal"></div>
</main>
<footer data-shell>365 Clicks · Fotografe. Compartilhe. Evolua.</footer>
<script>
document.addEventListener("c365:fotos", function () {
  "use strict";
  var F = window.Fotos, C = window.C365, feed = document.getElementById("feed"), count = document.getElementById("feed-count");
  var lote = 0, vistos = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* Cada lote é o catálogo em outra ordem. Enquanto a comunidade é pequena, as fotos se repetem. */
  function embaralhado(seed) {
    var a = F.lista.slice();
    for (var i = a.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; var j = Math.floor(seed / 233280 * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function carregarLote() {
    var fotos = lote === 0 ? F.lista.slice() : embaralhado(lote * 7 + 3);
    lote++;
    var html = fotos.map(function (f) {
      var ph = F.fotografo(f.fotografo);
      return '<article class="feed-card" data-photo="' + f.id + '">' +
        '<div class="who"><span class="avatar avatar-sm" style="--av:' + ph.av + '">' + F.iniciais(ph.nome) + '</span><div class="grow"><strong>' + esc(ph.nome) + '</strong> <span class="small">· ' + esc(f.local) + '</span></div><span class="day">DIA <b>' + f.dia + '</b></span></div>' +
        '<button class="ph" type="button" data-open-photo="' + f.id + '" aria-label="Abrir “' + esc(f.titulo) + '”, de ' + esc(ph.nome) + '" style="--ratio:' + f.ratio + ";background-image:url('" + f.thumb + "'),linear-gradient(160deg," + f.tone2 + "," + f.tone + ')"></button>' +
        '<div class="cap"><strong>' + esc(f.titulo) + "</strong><p>" + esc(f.descricao) + "</p>" +
        '<div class="cluster" style="gap:6px"><button class="btn btn-ghost btn-sm" type="button" aria-pressed="false" data-toggle data-on="Curtida registrada">' + C.icon("heart", "i-sm") + " " + f.curtidas + '</button><button class="btn btn-ghost btn-sm" type="button" data-open-photo="' + f.id + '">Comentar</button><span class="exif">' + esc(f.exif) + "</span></div></div>" +
        "</article>";
    }).join("");
    feed.insertAdjacentHTML("beforeend", html);
  }
  carregarLote(); carregarLote();

  function atualizar() {
    var cards = feed.querySelectorAll(".feed-card"), centro = feed.scrollLeft + feed.clientWidth / 2, n = 0;
    for (var i = 0; i < cards.length; i++) if (cards[i].offsetLeft < centro) n = i + 1;
    vistos = Math.max(vistos, n);
    count.textContent = vistos + " fotos vistas";
    if (feed.scrollLeft + feed.clientWidth > feed.scrollWidth - feed.clientWidth * 2) carregarLote();
  }
  feed.addEventListener("scroll", function () { window.requestAnimationFrame(atualizar); }, { passive: true });

  /* Roda do mouse vira rolagem horizontal */
  feed.addEventListener("wheel", function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); feed.scrollBy({ left: e.deltaY * 1.2 }); }
  }, { passive: false });
  function pular(d) {
    var card = feed.querySelector(".feed-card");
    feed.scrollBy({ left: d * (card ? card.offsetWidth + 20 : 400), behavior: "smooth" });
  }
  document.getElementById("feed-next").addEventListener("click", function () { pular(1); });
  document.getElementById("feed-prev").addEventListener("click", function () { pular(-1); });
  feed.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { e.preventDefault(); pular(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); pular(-1); }
  });
  atualizar();
});
</script>
</body></html>
